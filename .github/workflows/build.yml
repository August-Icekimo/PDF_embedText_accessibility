name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'        # 推送版本標籤時自動建置 (e.g. v1.0.0)
  workflow_dispatch:  # 也允許手動觸發

permissions:
  contents: write    # 需要寫入權限才能建立 Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: AccessiblePdfGenerator-linux
          - os: macos-latest
            artifact_name: AccessiblePdfGenerator-macos
          - os: windows-latest
            artifact_name: AccessiblePdfGenerator-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 安裝系統依賴 (WeasyPrint 需要 Cairo/Pango/GDK-PixBuf) ──

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libffi-dev \
            python3-tk \
            fonts-noto-cjk

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pango cairo gdk-pixbuf libffi python-tk

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # 使用 MSYS2 安裝 GTK 相關依賴
          choco install msys2 -y --no-progress
          # 以下路徑需根據實際 MSYS2 安裝位置調整
          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -Syu --noconfirm"
          C:\tools\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm mingw-w64-x86_64-pango mingw-w64-x86_64-cairo mingw-w64-x86_64-gdk-pixbuf2"
          echo "C:\tools\msys64\mingw64\bin" >> $env:GITHUB_PATH

      # ── Python 環境 ──

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 打包 ──

      - name: Build executable with PyInstaller
        run: |
          pyinstaller app.spec

      - name: Rename artifact (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mv dist/AccessiblePdfGenerator dist/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Move-Item dist\AccessiblePdfGenerator.exe dist\${{ matrix.artifact_name }}

      # ── 上傳 ──

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  # ── 建立 GitHub Release ──

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
